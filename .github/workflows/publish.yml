# Phase 4: a maintainer published a draft created by release.yml. Promotes the image
# that phase 3 built and tested to the official package. See RELEASE.md.
name: "Release: publish (on draft published)"
run-name: Publish ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

# Publishes run one at a time so floating tags (X.Y, X, latest) are computed in order.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the SBOM to the release
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          [[ "$TAG" == v* ]] || { echo "::error::Tag $TAG does not start with v"; exit 1; }
          version="${TAG#v}"
          mapfile -t published < <(git tag -l 'v*')
          python3 .github/scripts/release.py validate "$version" --published-self "${published[@]}"
          expected=$([[ "$version" == *-rc.* ]] && echo true || echo false)
          if [ "$PRERELEASE" != "$expected" ]; then
            echo "::error::$TAG must be published with pre-release=$expected"
            exit 1
          fi
          repo="${GITHUB_REPOSITORY,,}" # image names follow the repository: ghcr.io/<owner>/<repo>
          {
            echo "version=$version"
            echo "commit=$(git rev-parse "$TAG^{commit}")"
            echo "dev=$REGISTRY/$repo-dev"
            echo "official=$REGISTRY/$repo"
            echo "tags<<EOF"
            python3 .github/scripts/release.py tags "$version" "${published[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: ${{ vars.IMAGE_REGISTRY && 'network=host' || '' }}

      - if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the release image
        id: source
        env:
          SOURCE: ${{ steps.check.outputs.dev }}:release-${{ steps.check.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Manifest}}' | jq -r .digest)" || digest=""
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::$SOURCE not found. Releases must be prepared with the 'Release: prepare (manual)' workflow."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoting $SOURCE ($digest)"

      - name: Verify provenance
        if: ${{ !env.ACT }} # act has no attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.check.outputs.dev }}@${{ steps.source.outputs.digest }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          # Signed by the reusable image workflow, from the tagged commit, in a run of
          # the release workflow.
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/_image.yml" \
            --source-digest "$COMMIT" --format json > verification.json
          caller="$(jq -r '.[0].verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.path' verification.json)"
          if [ "$caller" != ".github/workflows/release.yml" ]; then
            echo "::error::Image was built by $caller, not by the release workflow"
            exit 1
          fi

      - name: Promote
        id: promote
        env:
          SOURCE: ${{ steps.check.outputs.dev }}@${{ steps.source.outputs.digest }}
          OFFICIAL: ${{ steps.check.outputs.official }}
          TAGS: ${{ steps.check.outputs.tags }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          args=()
          while read -r tag; do args+=(-t "$OFFICIAL:$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          digest="$(docker buildx imagetools inspect "$OFFICIAL:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $OFFICIAL@$digest as: $(echo $TAGS)"

      - name: Attest
        if: ${{ !env.ACT }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.check.outputs.official }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true
          create-storage-record: ${{ github.event.repository.owner.type == 'Organization' }}

      - name: Attach SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          IMAGE: ${{ steps.check.outputs.official }}@${{ steps.promote.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM.SPDX}}' > sbom.spdx.json
          jq -e '.packages | length > 0' sbom.spdx.json > /dev/null
          if [ -n "$ACT" ]; then
            echo "act: would upload sbom.spdx.json ($(jq '.packages | length' sbom.spdx.json) packages) to $TAG"
          else
            gh release upload "$TAG" sbom.spdx.json --repo "$GITHUB_REPOSITORY"
          fi

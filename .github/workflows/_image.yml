# Reusable: builds the image and, when asked, pushes it to the dev package with a
# provenance attestation. Called by ci.yml (phases 1 and 2) and release.yml (phase 3).
name: "Reusable: image"

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the triggering commit)
        type: string
        default: ''
      version:
        description: Release version; empty builds a main snapshot versioned by git describe
        type: string
        default: ''
      push:
        description: Push to the dev package and attest
        type: boolean
        default: false
    outputs:
      image:
        description: Dev image name, without tag
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Pushed digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

env:
  # Overridable for local runs against a test registry (see RELEASE.md).
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}

jobs:
  image:
    name: Image
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # git describe needs the history and tags

      - name: Version and tags
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          repo="${GITHUB_REPOSITORY,,}" # image names follow the repository: ghcr.io/<owner>/<repo>
          image="$REGISTRY/$repo-dev"
          commit="$(git rev-parse HEAD)"
          if [ -n "$VERSION" ]; then
            revision="$VERSION"
            tags="$image:release-$VERSION"
          else
            # e.g. 2.40.0-3-ga1b2c3d: 3 commits after v2.40.0
            revision="$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')"
            revision="${revision:-0-g${commit::7}}"
            tags="$image:sha-${commit::7}"$'\n'"$image:edge"
          fi
          {
            echo "image=$image"
            echo "commit=$commit"
            echo "created=$(git log -1 --format=%cI)"
            echo "revision=$revision"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building $revision ($commit)"

      - uses: docker/setup-buildx-action@v4
        with:
          # A local test registry is only reachable from the host network.
          driver-opts: ${{ vars.IMAGE_REGISTRY && 'network=host' || '' }}

      - if: inputs.push && env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: REVISION=${{ steps.meta.outputs.revision }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.push && steps.meta.outputs.tags || '' }}
          sbom: true
          # Layer cache written by builds of main and read by everyone: caches written by
          # pull requests are visible to that pull request alone, and releases build a
          # commit main has already cached. A cache failure never fails the build. act has
          # no GitHub cache service.
          cache-from: ${{ !env.ACT && 'type=gha,scope=image' || '' }}
          cache-to: ${{ !env.ACT && inputs.push && !inputs.version && 'type=gha,scope=image,mode=max,ignore-error=true' || '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=INATrace backend
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.version=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.licenses=MPL-2.0

      - name: Attest
        if: inputs.push && !env.ACT # act has no GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records are only available to organization-owned repositories.
          create-storage-record: ${{ github.event.repository.owner.type == 'Organization' }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and context smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        # The smoke test starts a mysql:8.4.11 container through Testcontainers, using
        # the Docker daemon already running on the hosted runner. No service
        # container is declared: Testcontainers owns the lifecycle.
        run: mvn -B --no-transfer-progress clean verify


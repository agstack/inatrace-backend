# Test profile: a real MySQL server, started by Testcontainers.
#
# The datasource is deliberately absent here. ContextBootSmokeTest starts a mysql:8.4.11
# container and @ServiceConnection hands Spring its url, username and password, so the
# tests run on the same database engine as production -- same dialect, same column
# types, same reserved words. Docker has to be available: on CI it is, and locally it
# is the same Docker that runs the development database.
#
# Hibernate builds the schema from the entity model, as it does on a fresh install.
# Flyway stays enabled but points at an empty location: MigrationsConfiguration injects
# the Flyway bean, so switching Flyway off fails the context. Running the real
# migrations needs a database that is still empty at startup, which is a separate test.
INATrace.env = DEV
spring.main.banner-mode = off
server.port = 0

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = com.abelium.inatrace.configuration.CustomMySQLDialect
spring.jpa.hibernate.naming.implicit-strategy = org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.autocommit = true
spring.jmx.enabled = false

spring.flyway.enabled = true
spring.flyway.baseline-on-migrate = true
spring.flyway.validate-on-migrate = false
spring.flyway.fail-on-missing-locations = false
spring.flyway.table = schema_version
spring.flyway.locations = classpath:/db/no-migrations

spring.jackson.serialization.write-dates-as-timestamps = false
spring.jackson.default-property-inclusion = non_null
spring.servlet.multipart.max-file-size = 10MB

# Mail / integrations are not exercised by these tests
management.health.mail.enabled = false
spring.mail.host = localhost
spring.mail.port = 1025
INATrace.mail.sendingEnabled = false
INATrace.mail.redirect = none
INATrace.loginManager.mail = admin@inatrace.test
INATrace.info.mail = info@inatrace.test
INATrace.mail.template.from = admin@inatrace.test

INATrace.auth.accessTokenCookieName = inatrace-accessToken
INATrace.auth.accessTokenExpirationSec = 3600
INATrace.auth.refreshTokenCookieName = inatrace-refreshToken
INATrace.auth.refreshTokenExpirationSec = 300
INATrace.auth.jwtSigningKey = test-only-signing-key-not-a-secret

INATrace.emailConfirmation.url = http://localhost:4200/confirm-email/
INATrace.passwordReset.url = http://localhost:4200/reset-password/
INATrace.fe.url = http://localhost:4200
INATrace.requestLog.token = none
INAtrace.exchangerate.apiKey = none
beyco.oauth2.clientSecret = none
beyco.oauth2.url = none
beyco.integration.url = none
INATrace.agstack.email = none
INATrace.agstack.password = none
INATrace.agstack.loginBaseURL = none
INATrace.agstack.baseURL = none

# Filesystem roots and integration ids the beans require at startup.
INATrace.fileStorage.root = ${java.io.tmpdir}/inatrace-test/file_storage
INATrace.documents.root = ${java.io.tmpdir}/inatrace-test/documents
INATrace.maxmindDB.path = ${java.io.tmpdir}/inatrace-test/GeoLite2-City.mmdb
beyco.oauth2.clientId = none
